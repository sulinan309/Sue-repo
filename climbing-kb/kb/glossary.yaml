# 攀岩知识库｜术语约定
#
# 各单元的中文主名称和别名写在单元自己的 name / aliases 字段里，
# 由 build.py 自动汇总成 dist/kb.json 的 alias_to_unit 索引。
# 本文件只收录单元字段承载不了的两件事：
#   1. 容易混淆的词（confusable）——它们是不同的东西，但常被当成一回事
#   2. 术语使用约定（conventions）——面向用户和面向专家的用词差别

conventions:
  中文优先: >
    面向用户的所有输出使用中文主名称。英文术语只在别名里保留，
    用于检索和专家沟通，不出现在产品文案里。
  国内岩馆用语优先: >
    中文主名称以国内商业岩馆的日常说法为准，不以教练体系的规范译法为准。
    例如用「折膝」而不是「埃及人」，用「旗式」而不是「挂旗」。
    教练体系的说法进 aliases。
  不造新词: >
    没有通用中文说法时，保留英文原词（如 smear、sloper），不自创译名。
  身体部位统一: >
    统一用「髋部」指代骨盆区域，不用「腰」「胯」「屁股」。
    面向用户的文案可以用「髋」，但不要混用多个词。

confusable:
  - terms: [重心, 支撑面]
    difference: >
      重心是身体质量的等效作用点；支撑面是各承重接触点围出的区域。
      「重心在支撑面内」才稳定——两个词描述的是不同的东西，不能互换。
    units: [PHY-GRAVITY-COM-001, PHY-EQUILIBRIUM-002]

  - terms: [身体张力, 核心力量]
    difference: >
      张力是「整条链的刚度和收紧时机」，属于技巧，可以在具体线路上练；
      核心力量是能力上限，属于力量库。
      很多人核心力量不差，但不知道什么时候收、收哪里。
      产品不应把「一伸手脚就掉」直接归因为核心力量不足。
    units: [TEC-POS-TENSION-003, FAULT-FOOT-CUT-003]

  - terms: [对抗力, 动作链]
    difference: >
      对抗关注接触点之间的受力关系（静态维持），
      动作链关注力从腿到手的传递顺序（有先后的动态过程）。
      两者共用「躯干刚度」这个条件，但解决的不是同一个问题。
    units: [PHY-OPPOSITION-005, PHY-KCHAIN-006]

  - terms: [侧身, 折膝]
    difference: >
      侧身是身体朝向的改变；折膝是更强的髋部旋转，
      额外在两只脚之间建立了对抗。折膝可以看作侧身的加强版，
      但膝关节负荷高得多，安全边界完全不同，必须分开写。
    units: [TEC-POS-ORIENT-002, TEC-MOV-DROPKNEE-003]

  - terms: [死点, 动态]
    difference: >
      死点通常至少有一只手还在点上，是受控上升的顶点，在竖直速度为零时抓握；
      动态是更大幅度、常常全身腾空的移动。
      把死点说成「小一点的动态」会让用户练错方向——
      死点练的是时机，不是幅度。
    units: [TEC-STR-SPEED-001, PHY-MOMENTUM-007]

  - terms: [开门, 握力不足]
    difference: >
      开门是力矩失衡（身体绕接触点连线旋转），
      直觉解法「抓紧一点」对它基本无效。
      把两者混淆是新手长期停滞的常见原因，产品尤其要避免。
    units: [FAULT-BARNDOOR-016, PHY-TORQUE-003]

  - terms: [踩准, 踩住]
    difference: >
      踩准解决落点位置（接触在有效受力面上）；
      踩住解决法向力来源（重量或对抗力压上去）。
      踩准了但没加载，这只脚等于不存在。
    units: [TEC-CON-FOOT-001, TEC-CON-LOAD-002]

  - terms: [摩擦系数, 法向力]
    difference: >
      摩擦系数由鞋底橡胶和岩点表面决定，上墙后基本改不了；
      法向力是用户在墙上唯一还能控制的变量。
      给提示时只能指向法向力（「压实一点」），
      不能指向摩擦系数（用户做不到，视频也看不出）。
    units: [PHY-FRICTION-004, FAULT-FOOT-SLIP-001]
